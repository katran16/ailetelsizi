<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cloud-Talkie Pro v8</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root { --neon-blue: #00f2fe; --neon-pink: #ff0055; --neon-green: #39ff14; }
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0b0e14; font-family: sans-serif; color: white; overflow: hidden; touch-action: manipulation; }
        .fs-btn { position: absolute; top: 15px; right: 15px; background: rgba(0, 242, 254, 0.1); border: 1px solid var(--neon-blue); color: var(--neon-blue); padding: 8px 12px; border-radius: 8px; cursor: pointer; z-index: 99; font-size: 10px; font-weight: bold; }
        .device { width: 320px; height: 620px; background: #1a1d23; border-radius: 50px; border: 2px solid #333; display: flex; flex-direction: column; align-items: center; padding: 25px; box-shadow: 0 0 40px #000; position: relative; }
        .screen { width: 100%; height: 140px; background: #000; margin-top: 10px; border-radius: 20px; border: 1px solid var(--neon-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 15px rgba(0,242,254,0.3); }
        .freq-display { font-size: 1.5rem; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); font-family: monospace; }
        .status { font-size: 0.7rem; color: var(--neon-green); margin-top: 8px; letter-spacing: 2px; }
        .peer-list { font-size: 0.6rem; color: var(--neon-pink); margin-top: 5px; opacity: 0.8; }
        .inputs { margin-top: 25px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
        input { background: #000; border: 1px solid #444; color: var(--neon-blue); padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; outline: none; font-size: 1rem; }
        .btn-join { background: var(--neon-blue); color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; transition: 0.3s; }
        .btn-join:disabled { background: #333 !important; color: #666 !important; cursor: not-allowed; }
        .ptt-container { width: 100%; display: flex; justify-content: center; align-items: center; margin-top: auto; margin-bottom: 20px; position: relative; }
        .ptt-btn { width: 170px; height: 170px; border-radius: 50%; border: 10px solid #222; background: radial-gradient(#222, #111); color: #333; font-size: 2rem; font-weight: 900; cursor: pointer; transition: 0.1s; -webkit-tap-highlight-color: transparent; outline: none; }
        .ptt-btn:active, .ptt-btn.transmitting { color: var(--neon-pink); border-color: var(--neon-pink); box-shadow: 0 0 40px var(--neon-pink); transform: scale(0.96); }
        .lock-btn { position: absolute; right: 0; width: 50px; height: 50px; border-radius: 50%; border: 2px solid #333; background: #222; color: #555; font-size: 0.6rem; font-weight: bold; cursor: pointer; transition: 0.3s; outline: none; }
        .lock-btn.locked { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); }
        .label { font-size: 0.5rem; color: #555; margin-top: 5px; }
    </style>
</head>
    <body onclick="initAudio()">
    <button class="fs-btn" onclick="toggleFS()">TAM EKRAN</button>
    <div class="device">
        <div class="screen">
            <div id="chanText" class="freq-display">OFFLINE</div>
            <div id="statusText" class="status">SİSTEM HAZIR</div>
            <div id="countText" class="peer-list">BAĞLI CİHAZ: 0</div>
        </div>
        <div class="inputs">
            <input type="text" id="roomName" placeholder="ODA NO">
            <button class="btn-join" id="joinBtn" onclick="joinCloudRoom()">BAĞLAN</button>
        </div>
        <div class="ptt-container">
            <button class="ptt-btn" id="pttBtn">PTT</button>
            <button class="lock-btn" id="lockBtn" onclick="toggleLock()">LOCK</button>
        </div>
        <div class="label">SİNYAL: %100 | NEON v8.1</div>
    </div>

    <script>
        function initAudio() {
    if (localStream) {
        // Bu boş fonksiyon, kullanıcının ekrana ilk dokunuşunda 
        // tarayıcı ses motorunu uyandıracaktır.
        console.log("Ses motoru uyandırıldı");
    }
}
        const firebaseConfig = {
            apiKey: "AIzaSyBWQL8kVLE6mR6yGN_pAv8yz9yi2d_wvj4",
            authDomain: "ailetelsizi.firebaseapp.com",
            databaseURL: "https://ailetelsizi-default-rtdb.firebaseio.com",
            projectId: "ailetelsizi",
            storageBucket: "ailetelsizi.firebasestorage.app",
            messagingSenderId: "828830713",
            appId: "1:828830713:web:6ee44f641ba60d74228328"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let myPeerId, roomName, peer, localStream, otherPeers = [], isConnected = false, isLocked = false;
        let activeCalls = [];

        const pttBtn = document.getElementById('pttBtn'), joinBtn = document.getElementById('joinBtn'), lockBtn = document.getElementById('lockBtn');

        // Mikrofonu başlat (Sürekli açık tut, sadece sustur)
        navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } }).then(s => {
            localStream = s;
            localStream.getAudioTracks()[0].enabled = false;
        }).catch(err => alert("Mikrofon hatası: " + err));

        function joinCloudRoom() {
            if (isConnected) return;
            roomName = document.getElementById('roomName').value.trim();
            if(!roomName) return alert("Oda nosu gir!");
            
            isConnected = true;
            joinBtn.disabled = true;
            joinBtn.innerText = "BAĞLANDI";

            peer = new Peer();

            peer.on('open', (id) => {
                myPeerId = id;
                document.getElementById('chanText').innerText = "CH: " + roomName;
                document.getElementById('statusText').innerText = "DİNLEMEDE";
                
                const myRef = db.ref('rooms/' + roomName + '/' + id);
                myRef.set(true);
                myRef.onDisconnect().remove();

                db.ref('rooms/' + roomName).on('value', (snap) => {
                    const data = snap.val() || {};
                    otherPeers = Object.keys(data).filter(pId => pId !== myPeerId);
                    document.getElementById('countText').innerText = "BAĞLI CİHAZ: " + otherPeers.length;
                });
            });

            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    playRemoteStream(remoteStream);
                });
            });
        }

        function playRemoteStream(stream) {
            let audio = document.createElement('audio');
            audio.srcObject = stream;
            audio.autoplay = true;
            audio.play().catch(e => console.log("Otomatik oynatma engellendi, etkileşim bekleniyor."));
        }

        function startBroadcasting() {
            if(!isConnected || !localStream) return;
            if(pttBtn.classList.contains('transmitting')) return;
            
            pttBtn.classList.add('transmitting');
            document.getElementById('statusText').innerText = "YAYINDA...";
            
            localStream.getAudioTracks()[0].enabled = true;
            
            otherPeers.forEach(pId => {
                const call = peer.call(pId, localStream);
                if(call) activeCalls.push(call);
            });
        }

        function stopBroadcasting() {
            if(isLocked || !pttBtn.classList.contains('transmitting')) return;
            
            pttBtn.classList.remove('transmitting');
            document.getElementById('statusText').innerText = "DİNLEMEDE";
            
            if(localStream) {
                localStream.getAudioTracks()[0].enabled = false;
            }
            
            activeCalls.forEach(call => {
                if(call.open) call.close();
            });
            activeCalls = [];
        }

        function toggleLock() {
            if(!isConnected) return;
            isLocked = !isLocked;
            if(isLocked) {
                lockBtn.classList.add('locked');
                startBroadcasting();
            } else {
                lockBtn.classList.remove('locked');
                stopBroadcasting();
            }
        }

        function toggleFS() {
            if (!document.fullscreenElement) document.documentElement.requestFullscreen();
            else document.exitFullscreen();
        }

        // Kontroller
        pttBtn.addEventListener('mousedown', startBroadcasting);
        pttBtn.addEventListener('mouseup', stopBroadcasting);
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startBroadcasting(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopBroadcasting(); });
    </script>
</body>
</html>
