<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Neon Cloud-Talkie Pro v14</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root { --neon-blue: #00f2fe; --neon-pink: #ff0055; --neon-green: #39ff14; }
        * { -webkit-tap-highlight-color: transparent; -webkit-touch-callout: none !important; -webkit-user-select: none !important; user-select: none !important; touch-action: none; }
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0b0e14; font-family: sans-serif; color: white; overflow: hidden; }
        .device { width: 320px; height: 620px; background: #1a1d23; border-radius: 50px; border: 2px solid #333; display: flex; flex-direction: column; align-items: center; padding: 25px; box-shadow: 0 0 40px #000; position: relative; }
        .screen { width: 100%; height: 140px; background: #000; margin-top: 10px; border-radius: 20px; border: 1px solid var(--neon-blue); display: flex; flex-direction: column; justify-content: center; align-items: center; box-shadow: inset 0 0 15px rgba(0,242,254,0.3); }
        .freq-display { font-size: 1.5rem; color: var(--neon-blue); text-shadow: 0 0 10px var(--neon-blue); font-family: monospace; }
        .status { font-size: 0.7rem; color: var(--neon-green); margin-top: 8px; letter-spacing: 2px; }
        .peer-list { font-size: 0.6rem; color: var(--neon-pink); margin-top: 5px; opacity: 0.8; }
        .inputs { margin-top: 25px; width: 100%; display: flex; flex-direction: column; gap: 12px; }
        input { background: #000; border: 1px solid #444; color: var(--neon-blue); padding: 15px; border-radius: 12px; text-align: center; font-weight: bold; outline: none; font-size: 1rem; user-select: auto !important; touch-action: auto !important; }
        .btn-join { background: var(--neon-blue); color: #000; border: none; padding: 12px; border-radius: 12px; font-weight: 900; cursor: pointer; text-transform: uppercase; }
        .ptt-container { width: 100%; display: flex; justify-content: center; align-items: center; margin-top: auto; margin-bottom: 20px; position: relative; }
        .ptt-btn { width: 170px; height: 170px; border-radius: 50%; border: 10px solid #222; background: radial-gradient(#222, #111); color: #444; font-size: 2rem; font-weight: 900; cursor: pointer; outline: none; display: flex; justify-content: center; align-items: center; transition: 0.1s; }
        .ptt-btn.active { color: var(--neon-pink) !important; border-color: var(--neon-pink) !important; box-shadow: 0 0 50px var(--neon-pink) !important; transform: scale(0.95); }
        .lock-btn { position: absolute; right: 0; width: 50px; height: 50px; border-radius: 50%; border: 2px solid #333; background: #222; color: #555; font-size: 0.6rem; font-weight: bold; cursor: pointer; outline: none; }
        .lock-btn.locked { border-color: var(--neon-green); color: var(--neon-green); box-shadow: 0 0 15px var(--neon-green); }
    </style>
</head>
<body oncontextmenu="return false;">
    <div class="device">
        <div class="screen">
            <div id="chanText" class="freq-display">OFFLINE</div>
            <div id="statusText" class="status">EKRANA DOKUNUN</div>
            <div id="countText" class="peer-list">CİHAZ: 0</div>
        </div>
        <div class="inputs">
            <input type="text" id="roomName" placeholder="ODA NO">
            <button class="btn-join" id="joinBtn" onclick="joinCloudRoom()">BAĞLAN</button>
        </div>
        <div class="ptt-container">
            <div class="ptt-btn" id="pttBtn">PTT</div>
            <button class="lock-btn" id="lockBtn" onclick="toggleLock()">LOCK</button>
        </div>
    </div>

    <script>
        const firebaseConfig = { apiKey: "AIzaSyBWQL8kVLE6mR6yGN_pAv8yz9yi2d_wvj4", authDomain: "ailetelsizi.firebaseapp.com", databaseURL: "https://ailetelsizi-default-rtdb.firebaseio.com", projectId: "ailetelsizi", storageBucket: "ailetelsizi.firebasestorage.app", messagingSenderId: "828830713", appId: "1:828830713:web:6ee44f641ba60d74228328" };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let myPeerId, roomName, peer, localStream, otherPeers = [], isConnected = false, isLocked = false, activeCalls = [];

        // SES MOTORUNU VE MİKROFONU ZORLA UYANDIR
        async function startSystem() {
            try {
                localStream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } });
                localStream.getAudioTracks()[0].enabled = false;
                document.getElementById('statusText').innerText = "SİSTEM HAZIR";
            } catch (e) { document.getElementById('statusText').innerText = "MİKROFON İZNİ GEREKLİ!"; }
        }

        // Ekranın herhangi bir yerine ilk dokunuşta sistemi başlat
        document.body.addEventListener('touchstart', () => { if(!localStream) startSystem(); }, {once: true});

        const pttBtn = document.getElementById('pttBtn');
        
        // DOKUNMATİK OLAYLARI (Pointer yerine Touch kullanıldı)
        pttBtn.addEventListener('touchstart', (e) => { e.preventDefault(); startBroadcasting(); });
        pttBtn.addEventListener('touchend', (e) => { e.preventDefault(); stopBroadcasting(); });
        pttBtn.addEventListener('touchcancel', (e) => { e.preventDefault(); stopBroadcasting(); });

        function joinCloudRoom() {
            if (isConnected) return;
            roomName = document.getElementById('roomName').value.trim();
            if(!roomName) return;
            isConnected = true;
            document.getElementById('joinBtn').innerText = "BAĞLANDI";
            peer = new Peer();
            peer.on('open', (id) => {
                myPeerId = id;
                document.getElementById('chanText').innerText = "CH: " + roomName;
                db.ref('rooms/' + roomName + '/' + id).set(Date.now());
                db.ref('rooms/' + roomName + '/' + id).onDisconnect().remove();
                db.ref('rooms/' + roomName).on('value', (snap) => {
                    const data = snap.val() || {};
                    const now = Date.now();
                    const activeIds = Object.keys(data).filter(id => (now - data[id] < 15000));
                    otherPeers = activeIds.filter(pId => pId !== myPeerId);
                    document.getElementById('countText').innerText = "CİHAZ: " + activeIds.length;
                });
            });
            peer.on('call', (call) => {
                call.answer(localStream);
                call.on('stream', (remoteStream) => {
                    const audio = new Audio();
                    audio.srcObject = remoteStream;
                    audio.play();
                });
            });
        }

        function startBroadcasting() {
            if(!isConnected || !localStream) return;
            pttBtn.classList.add('active');
            document.getElementById('statusText').innerText = "YAYINDA...";
            localStream.getAudioTracks()[0].enabled = true;
            otherPeers.forEach(pId => { const call = peer.call(pId, localStream); activeCalls.push(call); });
        }

        function stopBroadcasting() {
            if(isLocked) return;
            pttBtn.classList.remove('active');
            document.getElementById('statusText').innerText = "DİNLEMEDE";
            if(localStream) localStream.getAudioTracks()[0].enabled = false;
            activeCalls.forEach(c => c.close());
            activeCalls = [];
        }

        function toggleLock() {
            if(!isConnected) return;
            isLocked = !isLocked;
            const lb = document.getElementById('lockBtn');
            if(isLocked) { lb.classList.add('locked'); startBroadcasting(); }
            else { lb.classList.remove('locked'); stopBroadcasting(); }
        }

        setInterval(() => { if (isConnected && myPeerId && roomName) db.ref('rooms/' + roomName + '/' + myPeerId).set(Date.now()); }, 5000);
    </script>
</body>
</html>
