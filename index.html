<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Telsiz Pro v5</title>
    <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
    <style>
        :root { --blue: #00f2fe; --pink: #ff0055; }
        body { margin: 0; display: flex; justify-content: center; align-items: center; height: 100vh; background: #0b141a; font-family: sans-serif; color: white; overflow: hidden; }
        .device { width: 300px; height: 580px; background: #1a1d23; border-radius: 40px; border: 2px solid #333; display: flex; flex-direction: column; align-items: center; padding: 20px; box-shadow: 0 0 30px #000; }
        .screen { width: 100%; height: 120px; background: #000; border-radius: 15px; border: 1px solid var(--blue); display: flex; flex-direction: column; justify-content: center; align-items: center; margin-bottom: 20px; }
        .btn-join { background: var(--blue); color: #000; border: none; padding: 12px; border-radius: 10px; width: 100%; font-weight: bold; cursor: pointer; }
        .btn-join:disabled { background: #444; color: #888; }
        .ptt-btn { width: 150px; height: 150px; border-radius: 50%; background: #222; border: 8px solid #333; color: #444; font-size: 1.5rem; font-weight: bold; margin-top: auto; cursor: pointer; }
        .ptt-btn:active { border-color: var(--pink); color: var(--pink); box-shadow: 0 0 20px var(--pink); }
    </style>
</head>
<body>
    <div class="device">
        <div class="screen">
            <div id="chanText" style="color: var(--blue); font-size: 1.2rem;">OFFLINE</div>
            <div id="countText" style="color: var(--pink); font-size: 0.8rem; margin-top: 5px;">BAĞLI CİHAZ: 0</div>
        </div>
        <input type="text" id="roomName" placeholder="ODA NO" style="width: 100%; padding: 10px; background: #000; border: 1px solid #444; color: white; margin-bottom: 10px; text-align: center;">
        <button class="btn-join" id="joinBtn" onclick="joinRoom()">BAĞLAN</button>
        <button class="ptt-btn" id="pttBtn">PTT</button>
    </div>

    <script>
        const firebaseConfig = {
            apiKey: "AIzaSyBWQL8kVLE6mR6yGN_pAv8yz9yi2d_wvj4",
            authDomain: "ailetelsizi.firebaseapp.com",
            databaseURL: "https://ailetelsizi-default-rtdb.firebaseio.com",
            projectId: "ailetelsizi",
            storageBucket: "ailetelsizi.firebasestorage.app",
            messagingSenderId: "828830713",
            appId: "1:828830713:web:6ee44f641ba60d74228328"
        };
        firebase.initializeApp(firebaseConfig);
        const db = firebase.database();
        let myId, room, peer, localStream, others = [], isConnected = false;

        navigator.mediaDevices.getUserMedia({ audio: true }).then(s => localStream = s);

        function joinRoom() {
            room = document.getElementById('roomName').value;
            if(!room || isConnected) return;
            isConnected = true;
            document.getElementById('joinBtn').disabled = true;
            document.getElementById('joinBtn').innerText = "BAĞLANDI";

            peer = new Peer();
            peer.on('open', (id) => {
                myId = id;
                document.getElementById('chanText').innerText = "ODA: " + room;
                const ref = db.ref('rooms/' + room + '/' + id);
                ref.set(true);
                ref.onDisconnect().remove();

                db.ref('rooms/' + room).on('value', (snap) => {
                    const data = snap.val() || {};
                    others = Object.keys(data).filter(i => i !== myId);
                    document.getElementById('countText').innerText = "BAĞLI CİHAZ: " + others.length;
                });
            });

            peer.on('call', (c) => {
                c.answer(localStream);
                c.on('stream', (rs) => { const a = new Audio(); a.srcObject = rs; a.play(); });
            });
        }

        const ptt = document.getElementById('pttBtn');
        function start() { if(isConnected && others.length > 0) others.forEach(id => peer.call(id, localStream)); }
        ptt.addEventListener('mousedown', start);
        ptt.addEventListener('touchstart', (e) => { e.preventDefault(); start(); });
    </script>
</body>
</html>
